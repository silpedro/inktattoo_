<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <title>INK AGENDA - Login</title>
    <link rel="stylesheet" href="./styles/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Karantina:wght@300;400;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
</head>
<body class="pagina-login">
    <main class="container">
        <h1 class="main-title">INK AGENDA</h1>
        <p class="main-slogan">Faça login para acessar o sistema</p>

        <div class="login">
            <form id="form-login">
                <div class="campo">
                    <label class="sr-only" for="usuario">Nome de usuário ou e-mail</label>
                    <div class="login-forms">
                        <span class="icon" aria-hidden="true">👤</span>
                        <input type="text" id="usuario" name="usuario" placeholder="Nome de usuário ou e-mail"
                               autocomplete="username" required>
                    </div>
                </div>
                <div class="campo">
                    <label class="sr-only" for="senha-login">Senha</label>
                    <div class="login-forms">
                        <span class="icon" aria-hidden="true">🔒</span>
                        <input type="password" id="senha-login" name="senha" placeholder="Senha"
                               autocomplete="current-password" required>
                        <button type="button" class="mostrar-senha" id="mostrar-senha-login"
                                aria-controls="senha-login" aria-pressed="false">Mostrar</button>
                    </div>
                </div>

                <div class="opcoes">
                    <label>
                        <input type="checkbox" id="lembrar" name="lembrar"> Lembrar-me
                    </label>
                    <a href="#" id="esqueci-senha">Esqueci minha senha</a>
                </div>

                <p class="aviso" id="aviso-login" role="status" hidden></p>

                <button type="submit" class="login-btn">Entrar</button>
            </form>

            <div class="separator"></div>

            <p class="sem-conta">Não possui conta?</p>
            <a class="registro" href="./cadastro.html?tipo=tatuador">CADASTRE-SE COMO TATUADOR</a>
            <a class="registro" href="./cadastro.html?tipo=cliente">CADASTRE-SE COMO CLIENTE</a>
        </div>
    </main>

    <script src="./scripts/comum.js"></script>
    <script src="./scripts/login.js"></script>
</body>
</html>
